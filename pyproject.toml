[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# The distribution is "solarcal" because "suncal" on PyPI is an unrelated project.
# The import name is still `suncal`.
name = "solarcal"
version = "1.1.3"
description = "Ground radar monitoring of calibration using the Sun as reference."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Valentin Louf", email = "valentin.louf@bom.gov.au" }]
keywords = ["radar", "weather", "meteorology", "calibration"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "h5py",
    "numpy",
    "pandas",
    # The dask extra is required: suncal reads volumes with pyodim's lazy loader.
    "pyodim[dask]",
    "scikit-learn",
    "scipy",
]

[project.urls]
Homepage = "https://github.com/vlouf/suncal"
"Bug Reports" = "https://github.com/vlouf/suncal/issues"
Source = "https://github.com/vlouf/suncal/"

[dependency-groups]
test = ["pytest"]

[tool.setuptools.packages.find]
include = ["suncal*"]

[tool.pytest.ini_options]
testpaths = ["test"]
